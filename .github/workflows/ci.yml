# Every script parses, then every suite runs. The whole check is in modcommunity/dot-ci,
# so that fixing it is one commit rather than one per repository; its README says what
# the inputs are and why a release does not touch the content origin.
#
# branches: ['**'] rather than [main] on purpose. Several repositories in this family
# sit on a task branch for days, and a main-only trigger is a check that reports
# nothing about the work anybody is actually doing -- the same assumption that made
# push-github.sh push a stale ref, succeed, and send nothing.
name: CI

on:
    push:
        branches: ['**']
        paths-ignore:
            - '**/*.md'
            - 'screenshots/**'
    pull_request:
    workflow_dispatch:

jobs:
    validate:
        uses: modcommunity/dot-ci/.github/workflows/validate.yml@v1
        with:
            # Named, because auto-detection takes only examples/headless_* and this game's
            # two most important suites are not called that: `dedicated` (a real server and
            # the module) and `sandbox` (a real server and two real clients over real
            # sockets, which CLAUDE.md calls the one that matters). Left to detection, CI ran
            # four suites and neither of those. tools/check.sh reads this line, so it is the
            # one list; release.yml repeats it and check.sh fails if the two differ.
            suites: 'examples/headless_room examples/headless_stack examples/headless_presentation examples/headless_net examples/dedicated examples/sandbox'
            suite-timeout: 900
        secrets:
            DEPS_TOKEN: ${{ secrets.DOT_DEPS_TOKEN }}
